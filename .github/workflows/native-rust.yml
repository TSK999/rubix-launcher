name: Native Rust launcher
on:
  push:
    branches: [rust-rewrite]
    paths: ['native/**', '.github/workflows/native-rust.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native-rust.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release
      - name: Check real executable and database
        run: |
          $DataDir = Join-Path $env:RUNNER_TEMP 'rubix-native-check'
          $Process = Start-Process -FilePath '.\target\release\rubix-launcher.exe' -ArgumentList @('--self-check', '--data-dir', "`"$DataDir`"") -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw 'Native executable self-check failed.' }
          $Report = Get-Content (Join-Path $DataDir 'self-check.json') -Raw | ConvertFrom-Json
          if ($Report.integrity_check -ne 'ok') { throw 'Database integrity check failed.' }
      - name: Install packaging tools
        run: choco install nsis --no-progress -y
      - name: Package Windows release
        run: ./packaging/build-windows.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: rubix-native-windows-x64
          path: native/dist/*
          if-no-files-found: error
